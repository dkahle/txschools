$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/

name: txschools
label: Texas Education Agency public school-performance data (via txschools)
description: >
  Tables returned by the txschools R package, which downloads, caches,
  and parses public data published by the Texas Education Agency (TEA):
  TAPR (2013-present), SRC (2004-2019), AEIS (2004-2012), and PEIMS
  financial data (1999-2000-present). The package redistributes no
  data; every table below is materialized on demand from TEA's public
  pages and files. Values suppressed by TEA under FERPA are preserved
  as masking codes, never imputed.
details: >
  Rows are always accompanied by a `txschools` attribute recording the
  source URL, retrieval timestamp, and SHA-256 of the file each table
  was parsed from. Years follow TEA's ending-year convention
  throughout: `year = 2025` means the 2024-25 school year. Identifier
  columns (campus and district numbers) are strings so leading zeros
  survive. This dictionary describes the default tidy output of each
  getter; `output = "raw"` returns the file as published,
  all-character, and is not described here.

version:
  date: 2026-07-19

tables:
  - name: directory
    label: Campus and district directory
    description: >
      One row per Texas campus, district, region, or the state, for one
      school year. The name-to-identifier lookup behind
      txs_find_campus() and txs_find_district(). Returned by
      txs_directory().
    columns:
      - name: year
        type: number(ordinal)
        constraints: [required]
        description: School year ending calendar year.
        range: [2013, 2026]
      - name: level
        type: enum
        values: [campus, district, region, state]
        constraints: [required]
      - name: id
        type: string
        constraints: [required]
        description: >
          TEA organization identifier. Nine digits for a campus
          (county-district-campus), six for a district; zero-padded.
        examples: ["161920102", "161920", "12", "TX"]
      - name: name
        type: string
        constraints: [required]
        description: Entity name as published by TEA (upper case).
        examples: ["CHINA SPRING EL", "CHINA SPRING ISD"]
      - name: district
        type: string
        description: Owning district's six-digit number; null above district level.
        examples: ["161920", "057905"]
      - name: district_name
        type: string
        examples: ["CHINA SPRING ISD", "DALLAS ISD"]
      - name: county_name
        type: string
        examples: ["MCLENNAN", "DALLAS"]
      - name: region
        type: string
        description: Education Service Center region number.
        examples: ["12", "10"]
      - name: grade_span
        type: string
        description: Grades served, as published.
        examples: ["EE-05", "PK-12", "09-12"]

  - name: tapr_student
    label: TAPR student-information datasets
    description: >
      Nine semantic datasets parsed from a TAPR campus or district
      report's student-information page, one requested entity-year per
      pull. Grain: one row per category value (e.g. one grade level)
      per entity-year and basis. Returned inside the named list from
      txs_get_tapr(); the datasets `grade`, `ethnic`, `sex`,
      `cohorts`, `program`, `disability`, `mobility`, `attrition`, and
      `retention` all share this shape.
    details: >
      The category column is named for the dataset: `grade` in the
      grade dataset (documented below as the representative), `ethnic`,
      `sex`, `cohort`, `program`, `disability`, `mobility`,
      `attrition`, or `retention` in the others. Every measure column
      travels with `<measure>_masked` (true when TEA suppressed the
      value) and `<measure>_mask_code` (the verbatim suppression
      marker) companions.
    columns:
      - name: year
        type: number(ordinal)
        constraints: [required]
        range: [2013, 2026]
      - name: school_year
        type: string
        constraints: [required]
        description: Label form of `year`.
        examples: ["2024-25", "2023-24"]
      - name: level
        type: enum
        values: [campus, district]
        constraints: [required]
      - name: geography
        type: string
        constraints: [required]
        description: Campus (9-digit) or district (6-digit) number, zero-padded.
        examples: ["161920102", "161920"]
      - name: entity_name
        type: string
        examples: ["CHINA SPRING EL"]
      - name: district_name
        type: string
        examples: ["CHINA SPRING ISD"]
      - name: county_name
        type: string
        examples: ["MCLENNAN"]
      - name: source_url
        type: string
        description: TEA report page this row was parsed from.
        examples: ["https://rptsvr1.tea.texas.gov/cgi/sas/broker?..."]
      - name: retrieved_at
        type: datetime
        time_zone: UTC
        description: When the page was retrieved.
        range: ["2026-01-01T00:00:00Z", "2027-01-01T00:00:00Z"]
      - name: basis
        type: string
        description: Row context on the report (membership vs enrollment, etc.).
        examples: ["membership", "enrollment"]
      - name: grade
        type: string
        description: >
          Category column, named for the dataset requested (see table
          details). For the grade dataset, the grade level.
        examples: ["Kindergarten", "Grade 3", "Early Childhood Education"]
      - name: count
        type: number(quantity)
        units: students
        description: Student count as printed; null when masked.
        range: [0, 10000]
      - name: count_masked
        type: boolean
      - name: count_mask_code
        type: string
        description: Verbatim TEA suppression marker when masked.
        examples: ["*", ".", "-", "n/a", "<1%"]
      - name: campus_percent
        type: number(quantity)
        units: proportion
        description: >
          Campus share of the category as a proportion ("49.6%" parses
          to 0.496). Null when masked.
        range: [0, 1]
      - name: campus_percent_masked
        type: boolean
      - name: campus_percent_mask_code
        type: string
        examples: ["*", "."]
      - name: district_percent
        type: number(quantity)
        units: proportion
        range: [0, 1]
      - name: district_percent_masked
        type: boolean
      - name: district_percent_mask_code
        type: string
        examples: ["*", "."]
      - name: state_percent
        type: number(quantity)
        units: proportion
        range: [0, 1]
      - name: state_percent_masked
        type: boolean
      - name: state_percent_mask_code
        type: string
        examples: ["*", "."]

  - name: tapr_class_size
    label: TAPR average class sizes
    description: >
      Average class size by grade or subject for one entity-year,
      with campus, district, and state comparison values. The
      `class_size` dataset from txs_get_tapr(). Grain: one row per
      class-size measure per entity-year.
    details: >
      Shares the identity columns of `tapr_student` (year,
      school_year, level, geography, entity_name, district_name,
      county_name, source_url, retrieved_at, basis); only the measure
      columns differ and are documented here. Each measure carries
      `_masked`/`_mask_code` companions as in `tapr_student`.
    columns:
      - name: class_size
        type: string
        constraints: [required]
        description: The class-size measure (grade or subject).
        examples: ["Kindergarten", "Grade 6", "English/Language Arts"]
      - name: campus_class_size
        type: number(quantity)
        units: students per class
        range: [0, 40]
      - name: district_class_size
        type: number(quantity)
        units: students per class
        range: [0, 40]
      - name: state_class_size
        type: number(quantity)
        units: students per class
        range: [0, 40]

  - name: tapr_report
    label: TAPR report-page datasets (generic long form)
    description: >
      Cell-level long form of a TAPR report page for one entity-year.
      The datasets `staar_performance`, `staar_progress`,
      `bilingual_esl`, `ccmr`, `graduation`, `attendance`, `staff`,
      and `finance` from txs_get_tapr() all share this shape. Grain:
      one row per table cell of the report page (a row label crossed
      with a comparison-group column).
    details: >
      Shares the identity columns of `tapr_student` (year,
      school_year, level, geography, entity_name, district_name,
      county_name, source_url, retrieved_at). `value_num` is the
      number as printed by TEA: "90%" parses to 90, "$4,668" to 4668.
    columns:
      - name: page_source
        type: enum
        values: [student, staar_performance, staar_progress,
                 bilingual_esl, ccmr, graduation, attendance, staff,
                 finance]
        constraints: [required]
        description: Which TAPR page the cell came from.
      - name: table_index
        type: number(ordinal)
        description: Position of the source table on the page.
        range: [1, 60]
      - name: row_index
        type: number(ordinal)
        range: [1, 500]
      - name: section
        type: string
        description: Section heading context (TEA's colspan headings).
        examples: ["Grade 3 Reading", "STAAR Performance Rates"]
      - name: row_label
        type: string
        constraints: [required]
        examples: ["All Students", "Approaches Grade Level or Above"]
      - name: column
        type: string
        constraints: [required]
        description: Comparison-group column header.
        examples: ["Campus", "District", "State", "African American"]
      - name: value
        type: string
        constraints: [required]
        description: Cell value exactly as printed, masking codes intact.
        examples: ["90%", "$6,568", "23.1", "*"]
      - name: value_num
        type: number(quantity)
        description: Numeric parse of `value`; null when masked or non-numeric.
        range: [-.inf, .inf]
      - name: masked
        type: boolean
        constraints: [required]
      - name: mask_code
        type: string
        examples: ["*", ".", "-", "<1%"]

  - name: tapr_file
    label: TAPR statewide data files (tidy long form)
    description: >
      One statewide advanced-download data file (every campus or
      district in Texas for one year and dataset code such as REF or
      STAAR1), pivoted long. Returned by txs_get_tapr_file(). Grain:
      one row per entity per variable code.
    details: >
      Identifier columns mirror the file as published and vary by
      level: campus files carry a `CAMPUS` column, district files
      `DISTRICT`, and so on (zero-padded strings). Decode
      `variable_code` with the `tapr_dictionary` table.
    columns:
      - name: year
        type: number(ordinal)
        constraints: [required]
        range: [2013, 2026]
      - name: school_year
        type: string
        constraints: [required]
        examples: ["2023-24"]
      - name: level
        type: enum
        values: [campus, district, region, state]
        constraints: [required]
      - name: variable_code
        type: string
        constraints: [required]
        description: TEA variable mnemonic; see `tapr_dictionary`.
        examples: ["CAMPNAME", "CA00AR01S24R", "CDALLC"]
      - name: value
        type: string
        description: Value as published, masking codes intact.
        examples: ["90", "-1", "CHINA SPRING EL"]
      - name: value_num
        type: number(quantity)
        description: Numeric parse of `value`; null when masked or non-numeric.
        range: [-.inf, .inf]
      - name: masked
        type: boolean
        constraints: [required]
      - name: mask_code
        type: string
        examples: ["*", ".", "-1"]

  - name: tapr_dictionary
    label: TAPR variable dictionary
    description: >
      TEA's statewide variable dictionary workbooks parsed to one row
      per variable: the decoder for `tapr_file.variable_code`.
      Returned by txs_get_tapr_dictionary().
    columns:
      - name: year
        type: number(ordinal)
        constraints: [required]
        range: [2013, 2026]
      - name: school_year
        type: string
        constraints: [required]
        examples: ["2023-24"]
      - name: level
        type: enum
        values: [campus, district, region, state]
        constraints: [required]
      - name: sheet
        type: string
        description: Workbook sheet the variable was documented on.
        examples: ["cref", "cstaar1"]
      - name: dataset
        type: string
        description: Advanced-download dataset code the variable belongs to.
        examples: ["REF", "STAAR1", "PROF"]
      - name: variable
        type: string
        constraints: [required]
        examples: ["CAMPNAME", "CPETALLC"]
      - name: label
        type: string
        constraints: [required]
        description: Human-readable variable definition.
        examples: ["Campus Name", "Campus 2024 All Students Count"]

  - name: aeis
    label: AEIS statewide data files (tidy long form)
    description: >
      One statewide AEIS data file (2004-2012) by level and dataset
      code (e.g. ref, stud, fin), pivoted long. Returned by
      txs_get_aeis(). Grain: one row per entity per variable code.
    details: >
      Same tidy machinery as `tapr_file`: identifier columns mirror
      the file as published (`CAMPUS` or `DISTRICT`, zero-padded
      strings), and the record layout is available via
      txs_get_aeis(layout = TRUE).
    columns:
      - name: year
        type: number(ordinal)
        constraints: [required]
        range: [2004, 2012]
      - name: school_year
        type: string
        constraints: [required]
        examples: ["2010-11"]
      - name: level
        type: enum
        values: [campus, district, region, state]
        constraints: [required]
      - name: variable_code
        type: string
        constraints: [required]
        examples: ["DISTNAME", "DPETALLC"]
      - name: value
        type: string
        examples: ["CHINA SPRING ISD", "2456", "-1"]
      - name: value_num
        type: number(quantity)
        range: [-.inf, .inf]
      - name: masked
        type: boolean
        constraints: [required]
      - name: mask_code
        type: string
        examples: ["*", ".", "-1"]

  - name: src
    label: School Report Card (HTML era, tidy long form)
    description: >
      One campus's School Report Card for one year (2004-2012), parsed
      from TEA's fixed-width HTML into cell-level long form. Returned
      by txs_get_src(). Grain: one row per report line item per
      comparison-group column. (2013-2019 reports are PDF-only and are
      returned as a one-row file descriptor instead; 2020+ lives at
      txschools.gov, out of package scope.)
    columns:
      - name: year
        type: number(ordinal)
        constraints: [required]
        range: [2004, 2012]
      - name: school_year
        type: string
        constraints: [required]
        examples: ["2010-11"]
      - name: level
        type: enum
        values: [campus, district]
        constraints: [required]
      - name: geography
        type: string
        constraints: [required]
        examples: ["161920102"]
      - name: school_name
        type: string
        examples: ["CHINA SPRING EL"]
      - name: district_name
        type: string
        examples: ["CHINA SPRING ISD"]
      - name: page
        type: number(ordinal)
        range: [1, 10]
      - name: section
        type: string
        examples: ["TAKS Performance", "Attendance"]
      - name: measure
        type: string
        examples: ["Reading", "Attendance Rate"]
      - name: row_label
        type: string
        examples: ["All Students", "Grade 4"]
      - name: column
        type: string
        examples: ["Campus", "District", "State"]
      - name: value
        type: string
        constraints: [required]
        examples: ["94.0%", "*"]
      - name: value_num
        type: number(quantity)
        range: [-.inf, .inf]
      - name: masked
        type: boolean
        constraints: [required]
      - name: mask_code
        type: string
        examples: ["*", "."]

  - name: peims_finance
    label: PEIMS financial data (budget or actual)
    description: >
      TEA's statewide PEIMS single-file financial data: one row per
      district (or charter) x fund x function x object x
      organizational unit x program intent, for one school year and
      basis. Returned by txs_get_peims_finance(); also the shape of
      the `peims_finance_<basis>_<type>_<year>` tables that
      txs_write_peims_db() writes to DuckDB. District actual files
      run to several million rows per year.
    details: >
      The `*_label`, `district_name`, and `campus_name` columns are
      joined from TEA's companion code tables when `labels = TRUE`
      (the default) and are absent when the code tables cannot be
      fetched or `labels = FALSE`. Charter files use TEA's nonprofit
      chart of accounts; their asset/function/object/program-intent
      codes are normalized into the same columns. No FERPA masking
      applies to this table: values are dollar amounts, not student
      counts. Negative amounts are genuine (refunds, adjustments,
      contra accounts).
    columns:
      - name: district
        type: string
        constraints: [required]
        description: Six-digit district number, zero-padded; charters included.
        examples: ["161920", "001902", "003801"]
      - name: district_name
        type: string
        examples: ["CHINA SPRING ISD", "PINEYWOODS COMMUNITY ACADEMY"]
      - name: fin_unit
        type: string
        constraints: [required]
        description: >
          Three-digit organizational (fin) unit within the district;
          campus number where applicable, "000" for no cost center,
          "999" for undistributed.
        examples: ["000", "001", "101", "999"]
      - name: campus_name
        type: string
        examples: ["CHINA SPRING H S", "NO COST CENTER", "UNDISTRIBUTED"]
      - name: year
        type: number(ordinal)
        constraints: [required]
        range: [2000, 2026]
      - name: school_year
        type: string
        constraints: [required]
        examples: ["2023-24", "1999-00"]
      - name: basis
        type: enum
        values:
          actual: Audited actual financials, posted about a year after the fiscal year.
          budget: Adopted budgets, posted before the school year starts.
        constraints: [required]
      - name: type
        type: enum
        values:
          district: Traditional independent school districts.
          charter: Open-enrollment charter schools.
        constraints: [required]
      - name: fund_code
        type: string
        constraints: [required]
        description: Three-digit fund code (199 = general fund).
        examples: ["199", "211", "240", "420", "599"]
      - name: fund_label
        type: string
        examples: ["GENERAL FUND", "FOUNDATION SCHOOL PROGRAM"]
      - name: function_code
        type: string
        constraints: [required]
        description: Two-digit function (11 = instruction).
        examples: ["11", "23", "35", "51", "71"]
      - name: function_label
        type: string
        examples: ["INSTRUCTION", "FACILITY MAINTENANCE AND OPERATIONS"]
      - name: object_code
        type: string
        constraints: [required]
        description: >
          Four-digit object. 5xxx are revenues, 6xxx expenditures
          (61xx payroll, 62xx contracted services, 63xx supplies,
          64xx other operating, 65xx debt service, 66xx capital
          outlay), 3xxx fund balances.
        examples: ["5749", "6119", "6341", "3600"]
      - name: object_label
        type: string
        examples: ["SALARIES OR WAGES - TEACHERS AND OTHER PROFESSIONAL PERSONNEL"]
      - name: program_intent_code
        type: string
        description: Two-digit program intent (11 = basic educational services).
        examples: ["00", "11", "23", "30"]
      - name: program_intent_label
        type: string
        examples: ["BASIC EDUCATIONAL SERVICES", "TITLE I, PART A SCHOOLWIDE ACTIVITIES"]
      - name: amount
        type: number(quantity)
        units: USD
        constraints: [required]
        description: Budgeted or actual dollars; negatives are genuine.
        range: [-100000000, 2000000000]
      - name: fiscal_year
        type: number(ordinal)
        description: Fiscal year as recorded in the file; equals `year`.
        range: [2000, 2026]
      - name: updated
        type: date
        description: TEA's last-update stamp for the row.
        range: ["2000-01-01", "2027-12-31"]

  - name: peims_meta
    label: PEIMS provenance table (_peims_meta)
    description: >
      Written alongside every txs_write_peims_db() call: one row per
      table write, recording where and when the data came from.
      Stored in DuckDB as `_peims_meta`.
    columns:
      - name: table
        type: string
        constraints: [required]
        examples: ["peims_finance_actual_district_2024"]
      - name: year
        type: number(ordinal)
        range: [2000, 2026]
      - name: school_year
        type: string
        examples: ["2023-24"]
      - name: basis
        type: enum
        values: [actual, budget]
      - name: type
        type: enum
        values: [district, charter]
      - name: source_url
        type: string
        examples: ["https://tea.texas.gov/data-reports/financial-reports/school-finance-reports-and-data/actget2024.zip"]
      - name: retrieved_at
        type: string
        description: ISO 8601 retrieval timestamp of the source file.
        examples: ["2026-07-18T23:03:55Z"]
      - name: sha256
        type: string
        description: SHA-256 of the downloaded source file.
        examples: ["29785442f150..."]
      - name: written_at
        type: string
        description: ISO 8601 timestamp of the database write.
        examples: ["2026-07-18T23:04:12Z"]

  - name: tax_rates
    label: School district property tax rates
    description: >
      One row per district per school year: adopted M&O and I&S
      property-tax rates merged from the Texas Comptroller's annual
      rates-and-levies workbooks (tax years 2019 onward, primary) and
      TEA's adopted-tax-rates workbook (2005-06 onward, backfill).
      Returned by txs_get_tax_rates(). Rates are dollars per $100 of
      taxable value.
    details: >
      txs_derive_pennies() appends the HB3 decomposition columns
      (tier_one_rate, golden_rate, copper_rate, enrichment_rate,
      golden_pennies, copper_pennies); they are NA whenever `mcr` is NA.
      `mcr` itself is a user-supplied pluggable input -- TEA publishes
      no clean statewide Maximum Compressed Rate file -- so it is NA
      unless the caller provides one.
    columns:
      - name: year
        type: number(ordinal)
        constraints: [required]
        range: [2006, 2027]
      - name: school_year
        type: string
        constraints: [required]
        examples: ["2023-24", "2005-06"]
      - name: district
        type: string
        constraints: [required]
        description: Six-digit county-district number, zero-padded.
        examples: ["161920", "057905"]
      - name: district_name
        type: string
        examples: ["CHINA SPRING ISD", "China Spring ISD"]
      - name: mo_rate
        type: number(quantity)
        units: USD per $100 taxable value
        constraints: [required]
        range: [0, 2]
      - name: is_rate
        type: number(quantity)
        units: USD per $100 taxable value
        range: [0, 1]
      - name: total_rate
        type: number(quantity)
        units: USD per $100 taxable value
        description: >
          From the Comptroller file where published, else mo_rate plus
          is_rate.
        range: [0, 3]
      - name: mcr
        type: number(quantity)
        units: USD per $100 taxable value
        description: Maximum Compressed Rate; NA unless supplied by the caller.
        range: [0, 2]
      - name: rate_source
        type: enum
        values:
          comptroller: Texas Comptroller rates-and-levies workbook.
          tea: TEA adopted-tax-rates workbook (backfill).
        constraints: [required]

  - name: crosswalk
    label: TEA district number to NCES LEAID crosswalk
    description: >
      One row per Texas school district linking TEA's six-digit
      county-district number to the seven-digit NCES LEAID (the Census
      GEOID used by boundary files). Built from the NCES CCD directory
      via the Urban Institute Education Data API. Returned by
      txs_crosswalk().
    columns:
      - name: geoid
        type: string
        constraints: [primary_key]
        description: Seven-digit NCES LEAID / Census GEOID.
        examples: ["4813960", "4816860"]
      - name: district
        type: string
        constraints: [required]
        examples: ["161920", "057905"]
      - name: lea_name
        type: string
        examples: ["CHINA SPRING ISD"]

  - name: boundaries
    label: District boundaries (sf)
    description: >
      Simplified Census cartographic school-district boundaries for
      Texas in WGS84, one polygon per district, returned as an sf data
      frame by txs_boundaries(). Join TEA-keyed tables through the
      crosswalk table.
    columns:
      - name: geoid
        type: string
        constraints: [primary_key]
        examples: ["4813960"]
      - name: name
        type: string
        examples: ["China Spring ISD"]
      - name: geometry
        description: sf polygon geometry (EPSG:4326); not a scalar column.

relationships:
  - join: peims_finance.district = directory.district
    cardinality: many-to-one
    description: >
      A PEIMS finance row's district resolves to the directory's
      district entry for the same year (directory `level = "district"`
      rows carry the district number in both `id` and `district`).
    conflicts: [district_name, year]
  - join: tapr_student.geography = directory.id
    cardinality: many-to-one
    description: >
      A TAPR entity's campus or district number resolves to its
      directory entry for the same year.
    conflicts: [district_name, county_name, year, level]
  - join: tapr_file.variable_code = tapr_dictionary.variable
    cardinality: many-to-one
    description: >
      Statewide-file variable codes are defined in the dictionary for
      the same year and level.
    conflicts: [year, school_year, level]
  - join: tax_rates.district = crosswalk.district
    cardinality: many-to-one
    description: >
      Tax-rate rows resolve to Census geography through the crosswalk.
  - join: crosswalk.geoid = boundaries.geoid
    cardinality: one-to-one
    description: >
      The crosswalk's LEAID is the boundary file's GEOID.

glossary:
  TEA: Texas Education Agency, the state agency overseeing public K-12 education in Texas.
  TAPR: >
    Texas Academic Performance Reports (2013-present), TEA's annual
    campus/district/region/state report cards; successor to AEIS.
  AEIS: >
    Academic Excellence Indicator System (through 2011-12), the
    predecessor of TAPR.
  SRC: >
    School Report Card, a condensed per-campus report TEA publishes
    alongside TAPR/AEIS.
  PEIMS: >
    Public Education Information Management System, TEA's statewide
    data collection; its financial submission is the source of the
    peims_finance table.
  campus number: >
    Nine-digit county-district-campus identifier; the first six digits
    are the district number, the last three the campus. Always handled
    as a zero-padded string.
  district number: >
    Six-digit identifier for a district or open-enrollment charter
    (charters share the district number space).
  ending year: >
    The package identifies school years by their ending calendar year:
    2025 means the 2024-25 school year, matching TEA's URLs.
  masking: >
    FERPA-driven suppression TEA applies to small student counts.
    Masked cells keep their verbatim marker ("*", ".", "<1%", -1
    style sentinels) in `value`/`mask_code`, with `masked = true` and
    a null numeric value. Never imputed. Not applicable to PEIMS
    finance (dollars, not students).
  fund: >
    Revenue source bucket in TEA's chart of accounts (e.g. 199 general
    fund, 211 Title I, 240 school nutrition, 599 debt service).
  function: >
    Purpose of an expenditure in TEA's chart of accounts (e.g. 11
    instruction, 23 school leadership, 51 facility maintenance and
    operations, 71 debt service).
  object: >
    What was bought or received (e.g. 61xx payroll, 62xx contracted
    services, 66xx capital outlay; 5xxx revenues).
  program intent: >
    Student population an expenditure is intended to serve (e.g. 11
    basic educational services, 23 special education).
  fin unit: >
    Organizational unit within a district in PEIMS finance; campus
    number where the money is attributable to a campus, otherwise
    "000" (no cost center) or "999" (undistributed).
  charter: >
    Open-enrollment charter school, reported by TEA under the
    nonprofit chart of accounts in PEIMS finance and as districts in
    most other tables.
  ESC region: >
    One of twenty Education Service Center regions Texas districts
    belong to (e.g. Region 12, Waco).
