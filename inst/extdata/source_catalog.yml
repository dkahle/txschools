src:
  label: School Report Card
  base: https://rptsvr1.tea.texas.gov/perfreport/src
  # SRC is published as per-campus reports, not bulk data files.
  # 2004-2012: HTML (fixed-width text) via broker prgopt
  #   "{year}/src/alltypec.sas" (POST; search=campnum, namenum=<id>,
  #   ptype=HTML).
  # 2013-2019: PDF only via broker prgopt "{year}/src/src.sas" (GET;
  #   cyr=<year>, level=campus|district, campus=<id>|district=<id>).
  # 2020+: published on https://txschools.gov, out of package scope.
  years_html: [2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012]
  years_pdf: [2013, 2014, 2015, 2016, 2017, 2018, 2019]
  search_page: "{base}/{year}/campus.srch.html"
